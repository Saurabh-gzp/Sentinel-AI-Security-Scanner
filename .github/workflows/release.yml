name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package (e.g. v1.3.7)'
        required: true

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          case "$tag" in
            v*) echo "tag=$tag"  >> "$GITHUB_OUTPUT"; echo "ver=${tag#v}" >> "$GITHUB_OUTPUT" ;;
            *)  echo "Tag must start with 'v' (got: $tag)" >&2; exit 1 ;;
          esac

      - name: Verify versionName matches tag
        run: |
          want="${{ steps.ver.outputs.ver }}"
          have="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-app/app/build.gradle | head -1)"
          if [[ "$have" != "$want" ]]; then
            echo "Tag ${{ steps.ver.outputs.tag }} expects versionName '$want' but build.gradle says '$have'." >&2
            echo "Bump android-app/app/build.gradle and commit before tagging." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Package release artifacts
        run: ./package_release.sh "${{ steps.ver.outputs.ver }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Sentinel ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES_${{ steps.ver.outputs.ver }}.md
          draft: false
          prerelease: false
          files: |
            app/${{ steps.ver.outputs.tag }}/Sentinel-${{ steps.ver.outputs.tag }}-debug.apk
            app/${{ steps.ver.outputs.tag }}/Sentinel-app-source-v${{ steps.ver.outputs.ver }}.zip
            app/${{ steps.ver.outputs.tag }}/SHA256SUMS.txt
